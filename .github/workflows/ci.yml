name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketplace_hub
          POSTGRES_PASSWORD: marketplace_hub
          POSTGRES_DB: marketplace_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace_hub -d marketplace_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://marketplace_hub:marketplace_hub@localhost:5432/marketplace_hub
      JWT_SECRET: ci-only-secret
      CHROME_BIN: /usr/bin/google-chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm --filter @marketplace-hub/api exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
