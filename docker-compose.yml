services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketplace_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace_hub}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_hub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketplace_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
