<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Marketplace Hub — Copia annuncio</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Copia annuncio</h1>

      <section class="auth-section">
        <div class="list-header">
          <strong>Account Marketplace Hub</strong>
          <button id="logout" type="button" hidden>Esci</button>
        </div>
        <p id="auth-status" role="status">Non autenticato</p>
        <div id="login-form">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="username" />
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" />
          <button id="login" type="button">Accedi</button>
          <button id="open-signup" type="button">Crea account nella web app</button>
          <small>La password non viene salvata dall’estensione.</small>
        </div>
      </section>

      <section class="settings">
        <label for="api-base-url">URL API</label>
        <div class="settings-row">
          <input id="api-base-url" type="text" spellcheck="false" />
          <button id="save-api-base-url" type="button">Salva</button>
        </div>
        <label for="web-app-base-url">URL web app</label>
        <div class="settings-row">
          <input id="web-app-base-url" type="text" spellcheck="false" />
          <button id="save-web-app-base-url" type="button">Salva</button>
        </div>
      </section>

      <section class="list-section">
        <div class="list-header">
          <span>Annunci</span>
          <button id="refresh" type="button">Aggiorna</button>
        </div>
        <p id="status" role="status"></p>
        <label for="announcement-search">Cerca annunci</label>
        <input
          id="announcement-search"
          type="search"
          placeholder="Titolo, descrizione o categoria"
        />
        <select id="announcement-select" size="6"></select>
      </section>

      <section class="actions" id="actions" hidden>
        <button id="copy-title" type="button">Copia titolo</button>
        <button id="copy-description" type="button">Copia descrizione</button>
        <button id="copy-price" type="button">Copia prezzo</button>
        <button id="copy-summary" type="button">Copia riepilogo completo</button>
        <button id="open-in-web-app" type="button">Apri nella web app</button>
        <button id="fill-demo-form" type="button">Compila pagina form demo</button>
      </section>

      <p id="feedback" role="status"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
