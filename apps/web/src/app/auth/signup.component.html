<main class="auth-panel">
  <h1>Crea un account</h1>
  <p>Registrati per creare e pubblicare il tuo annuncio centrale.</p>

  @if (errors().length > 0) {
    <section class="error-panel" aria-live="assertive">
      <ul>
        @for (error of errors(); track error) {
          <li>{{ error }}</li>
        }
      </ul>
    </section>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span>Email</span>
      <input formControlName="email" type="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small>Inserisci un indirizzo email valido.</small>
      }
    </label>

    <label class="field">
      <span>Password</span>
      <input formControlName="password" type="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small>Almeno 8 caratteri.</small>
      }
    </label>

    <button class="primary-action" type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Registrazione…' : 'Registrati' }}
    </button>
  </form>

  <p class="switch-link">Hai già un account? <a routerLink="/login">Accedi</a></p>
</main>
